name: Bug report
description: Something does not sync, install or show the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, private repo contents or anything personal. For a security problem use the private report link on the issue chooser instead.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: claude-sync version
      description: Shown in Settings, or run `claude-sync status`.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Which one are you using?
      options:
        - Desktop app
        - Headless claude-sync-cli
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
