name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x bin/claude-sync lib/*.sh tests/*.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        env:
          GIT_AUTHOR_NAME: claude-sync-ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: claude-sync-ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: bash tests/run.sh
