# The checks of scripts/check.ps1 / check.sh on Linux, Windows and macOS, for every pull
# request and every push to main. GitHub-hosted runners only, no secrets.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # webkit2gtk brings gtk-3, soup-3 and wayland; pipewire, gbm and xcb are for xcap
      # (screenshots; libspa-sys runs bindgen, hence libclang); dbus for libdbus-sys. The
      # appindicator, rsvg, xdo and ssl packages are what Tauri's Linux guide lists for the
      # tray and bundling.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libpipewire-0.3-dev libdbus-1-dev libgbm-dev libxcb1-dev libclang-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            app/ui/pnpm-lock.yaml
            relay/pnpm-lock.yaml

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The app's Tauri crate embeds app/ui/dist at compile time, so the UI is built first.
      - name: pnpm -C app/ui install
        run: pnpm -C app/ui install --frozen-lockfile
      - name: pnpm -C app/ui build
        run: pnpm -C app/ui build

      # The remaining checks run even when an earlier one failed, like check.ps1.
      - name: cargo fmt --check
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: pnpm -C relay install
        if: ${{ !cancelled() }}
        run: pnpm -C relay install --frozen-lockfile
      - name: pnpm -C relay test
        if: ${{ !cancelled() }}
        run: pnpm -C relay test
      - name: pnpm -C relay typecheck
        if: ${{ !cancelled() }}
        run: pnpm -C relay typecheck
