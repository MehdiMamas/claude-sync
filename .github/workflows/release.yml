# Builds a release on GitHub-hosted runners and uploads it to a DRAFT release v<version>
# (docs/releasing.md, docs/architecture.md §13). Publishing the draft stays manual.
#
#   git tag v0.2.0 <merged bump commit> && git push origin v0.2.0
#   or: gh workflow run release.yml --repo MehdiMamas/claude-sync -f version=0.2.0
#
# The build jobs run in the environment "release" (required reviewers). They use, from the
# environment or the repository (docs/releasing.md says where each one lives):
#   secret   TAURI_SIGNING_PRIVATE_KEY     contents of the updater key (updater.key), empty password
#   secret   APPLE_CERTIFICATE             base64 of the Developer ID Application .p12
#   secret   APPLE_CERTIFICATE_PASSWORD    its password
#   secret   APPLE_SIGNING_IDENTITY        e.g. "Developer ID Application: <name> (TEAMID)"
#   secret   APPLE_API_ISSUER              App Store Connect API issuer id (notarization)
#   secret   APPLE_API_KEY                 App Store Connect API key id
#   secret   APPLE_API_KEY_P8              contents of AuthKey_<key id>.p8
#   variable CLAUDE_SYNC_RELAY_URL         e.g. https://claude-sync-relay.vercel.app
#   variable CLAUDE_SYNC_GITHUB_CLIENT_ID  the OAuth app's public client ID
# Without any of the APPLE_* secrets the macOS build is unsigned (the job summary says so);
# with only some of them the job fails.
#
# No caches: a release build never restores a cache another workflow could have written.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.2.0. Built from tag v<version> if it exists, else from the selected branch."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve the version and commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            version="${REF_NAME#v}"
            commit="$GITHUB_SHA"
          else
            version="${INPUT_VERSION#v}"
            # An existing tag wins over the selected branch, so a rerun builds the tagged commit.
            if ref=$(gh api "repos/$GH_REPO/git/ref/tags/v$version" 2>/dev/null); then
              commit=$(jq -r .object.sha <<<"$ref")
              if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
                commit=$(gh api "repos/$GH_REPO/git/tags/$commit" --jq .object.sha)
              fi
            else
              commit="$GITHUB_SHA"
            fi
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semver like 0.2.0 (tag v0.2.0), got '$version'"
            exit 1
          fi
          # A published release is never rebuilt. (A draft is not visible to this read-only token.)
          if info=$(gh release view "v$version" --json isDraft 2>/dev/null) && [ "$(jq -r .isDraft <<<"$info")" = false ]; then
            echo "::error::release v$version is already published; release a new version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $commit" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.commit }}
          persist-credentials: false

      - name: Check the version in the files
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: node scripts/bump-version.mjs --check "$VERSION"

  build:
    needs: prepare
    name: build (${{ matrix.platform }})
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev             libpipewire-0.3-dev libdbus-1-dev libgbm-dev libxcb1-dev libclang-dev             patchelf libfuse2 xdg-utils file

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.platform }}" = macos ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Install dependencies
        run: |
          pnpm -C app install --frozen-lockfile
          pnpm -C app/ui install --frozen-lockfile

      - name: Check the build configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CLAUDE_SYNC_RELAY_URL: ${{ vars.CLAUDE_SYNC_RELAY_URL }}
          CLAUDE_SYNC_GITHUB_CLIENT_ID: ${{ vars.CLAUDE_SYNC_GITHUB_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY CLAUDE_SYNC_RELAY_URL CLAUDE_SYNC_GITHUB_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set (see the top of release.yml)"
              exit 1
            fi
          done
          case "${CLAUDE_SYNC_RELAY_URL%/}" in
            *.invalid) echo "::error::CLAUDE_SYNC_RELAY_URL is the .invalid placeholder"; exit 1 ;;
          esac

      - name: macOS signing setup
        id: signing
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          present=() missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -n "${!name:-}" ]; then present+=("$name"); else missing+=("$name"); fi
          done
          if [ ${#present[@]} -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No APPLE_* secrets: the macOS build is NOT signed or notarized."
            {
              echo "### macOS build is unsigned"
              echo "No APPLE_* secrets are set, so the .app and .dmg are neither signed with Developer ID nor notarized."
              echo "macOS users must right-click > Open the first time. See the top of release.yml for the secrets."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Some APPLE_* secrets are set but these are missing: ${missing[*]}"
            exit 1
          else
            # Tauri imports APPLE_CERTIFICATE into a temporary keychain itself; notarization
            # needs the API key as a file.
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "macOS build signed with Developer ID and notarized." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CLAUDE_SYNC_RELAY_URL: ${{ vars.CLAUDE_SYNC_RELAY_URL }}
          CLAUDE_SYNC_GITHUB_CLIENT_ID: ${{ vars.CLAUDE_SYNC_GITHUB_CLIENT_ID }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
        run: |
          set -euo pipefail
          # Tauri treats a variable that is set but empty as set, so drop them for an unsigned build.
          if [ "$SIGNED" != true ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi
          unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # --ci: the updater key has an empty password, and no prompts.
          case "${{ matrix.platform }}" in
            windows) pnpm -C app tauri build --bundles nsis --ci ;;
            macos) pnpm -C app tauri build --target universal-apple-darwin --bundles app,dmg --ci ;;
            linux) pnpm -C app tauri build --bundles deb,appimage --ci ;;
          esac

      - name: Check the macOS signature and notarization
        if: matrix.platform == 'macos' && steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          app=target/universal-apple-darwin/release/bundle/macos/claude-sync.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Stage the assets
        run: |
          set -euo pipefail
          stage="dist/release/$VERSION"
          rm -rf "$stage"
          mkdir -p "$stage"
          # Names from relay/lib/assets.ts.
          case "${{ matrix.platform }}" in
            windows)
              out=target/release/bundle/nsis
              base="claude-sync_${VERSION}_windows_x86_64-setup.exe"
              cp "$out/claude-sync_${VERSION}_x64-setup.exe" "$stage/$base"
              cp "$out/claude-sync_${VERSION}_x64-setup.exe.sig" "$stage/$base.sig"
              node scripts/verify-updater-sig.mjs "$stage/$base" "$stage/$base.sig"
              ;;
            macos)
              out=target/universal-apple-darwin/release/bundle
              base="claude-sync_${VERSION}_darwin_universal"
              cp "$out/macos/claude-sync.app.tar.gz" "$stage/$base.app.tar.gz"
              cp "$out/macos/claude-sync.app.tar.gz.sig" "$stage/$base.app.tar.gz.sig"
              cp "$out/dmg/claude-sync_${VERSION}_universal.dmg" "$stage/$base.dmg"
              node scripts/verify-updater-sig.mjs "$stage/$base.app.tar.gz" "$stage/$base.app.tar.gz.sig"
              ;;
            linux)
              out=target/release/bundle
              base="claude-sync_${VERSION}_linux_x86_64"
              cp "$out/appimage/claude-sync_${VERSION}_amd64.AppImage" "$stage/$base.AppImage"
              cp "$out/appimage/claude-sync_${VERSION}_amd64.AppImage.sig" "$stage/$base.AppImage.sig"
              cp "$out/deb/claude-sync_${VERSION}_amd64.deb" "$stage/$base.deb"
              node scripts/verify-updater-sig.mjs "$stage/$base.AppImage" "$stage/$base.AppImage.sig"
              ;;
          esac
          ls -l "$stage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/${{ needs.prepare.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: Upload to the draft release
        run: |
          set -euo pipefail
          files=(assets/*)
          {
            echo "### Assets of v$VERSION"
            echo '```'
            (cd assets && sha256sum ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if info=$(gh release view "v$VERSION" --json isDraft 2>/dev/null); then
            if [ "$(jq -r .isDraft <<<"$info")" != true ]; then
              echo "::error::release v$VERSION is already published; its assets are not replaced"
              exit 1
            fi
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            # Always a draft: publishing is a separate, manual step (docs/releasing.md).
            gh release create "v$VERSION" "${files[@]}" --draft --target "$COMMIT" \
              --title "claude-sync $VERSION" --generate-notes
          fi
          echo "Draft release v$VERSION is ready: publish it by hand (docs/releasing.md)." >> "$GITHUB_STEP_SUMMARY"
