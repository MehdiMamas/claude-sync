# Builds the universal macOS app for a release and uploads it to the release's draft
# (docs/releasing.md, docs/architecture.md §13). Manual only, and only on Mehdi's own Mac
# runner: no hosted minutes.
#
# Run it after scripts/release.ps1 -Publish created the draft release v<version>:
#   gh workflow run release-macos.yml --repo MehdiMamas/claude-sync -f version=<version>
#
# Repository settings (Settings > Secrets and variables > Actions):
#   secret   TAURI_SIGNING_PRIVATE_KEY     contents of the updater key (updater.key), empty password
#   variable CLAUDE_SYNC_RELAY_URL         e.g. https://claude-sync-relay.vercel.app (a secret of that name also works)
#   variable CLAUDE_SYNC_GITHUB_CLIENT_ID  the OAuth app's public client ID (a secret of that name also works)
#
# The runner needs: Xcode command line tools, rustup with aarch64-apple-darwin and
# x86_64-apple-darwin, Node 24, pnpm, gh. Labels: self-hosted, macOS.

name: release-macos

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, e.g. 0.2.0 (the draft release v<version> must exist)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the release commit
        id: release
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semver without a leading v, got '$VERSION'"
            exit 1
          fi
          info=$(gh release view "v$VERSION" --json isDraft,targetCommitish) || {
            echo "::error::release v$VERSION does not exist; run scripts/release.ps1 -Version $VERSION -Publish first"
            exit 1
          }
          draft=$(jq -r .isDraft <<<"$info")
          commit=$(jq -r .targetCommitish <<<"$info")
          if [ "$draft" != "true" ]; then
            echo "::warning::release v$VERSION is already published; uploading the macOS assets to it anyway"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.commit }}

      - name: Check the version in the checkout
        run: |
          set -euo pipefail
          have=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$have" != "$VERSION" ]; then
            echo "::error::Cargo.toml at ${{ steps.release.outputs.commit }} has version '$have', not $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          pnpm -C app install --frozen-lockfile
          pnpm -C app/ui install --frozen-lockfile

      - name: Build the universal app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CLAUDE_SYNC_RELAY_URL: ${{ vars.CLAUDE_SYNC_RELAY_URL || secrets.CLAUDE_SYNC_RELAY_URL }}
          CLAUDE_SYNC_GITHUB_CLIENT_ID: ${{ vars.CLAUDE_SYNC_GITHUB_CLIENT_ID || secrets.CLAUDE_SYNC_GITHUB_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY CLAUDE_SYNC_RELAY_URL CLAUDE_SYNC_GITHUB_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set (see the top of this workflow)"
              exit 1
            fi
          done
          case "${CLAUDE_SYNC_RELAY_URL%/}" in
            *.invalid) echo "::error::CLAUDE_SYNC_RELAY_URL is the .invalid placeholder"; exit 1 ;;
          esac
          # --ci: the updater key has an empty password, and no prompts.
          pnpm -C app tauri build --target universal-apple-darwin --bundles app,dmg --ci

      - name: Stage the assets
        run: |
          set -euo pipefail
          out=target/universal-apple-darwin/release/bundle
          stage="dist/release/$VERSION"
          rm -rf "$stage"
          mkdir -p "$stage"
          # Names from relay/lib/assets.ts.
          base="claude-sync_${VERSION}_darwin_universal"
          cp "$out/macos/claude-sync.app.tar.gz" "$stage/$base.app.tar.gz"
          cp "$out/macos/claude-sync.app.tar.gz.sig" "$stage/$base.app.tar.gz.sig"
          cp "$out/dmg/claude-sync_${VERSION}_universal.dmg" "$stage/$base.dmg"
          node scripts/verify-updater-sig.mjs "$stage/$base.app.tar.gz" "$stage/$base.app.tar.gz.sig"
          (cd "$stage" && ls -l && shasum -a 256 ./*)

      - name: Upload to the release
        run: |
          set -euo pipefail
          base="dist/release/$VERSION/claude-sync_${VERSION}_darwin_universal"
          gh release upload "v$VERSION" "$base.app.tar.gz" "$base.app.tar.gz.sig" "$base.dmg" --clobber
