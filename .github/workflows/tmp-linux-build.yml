name: tmp-linux-build
on:
  push:
    branches: [linux-release-fix]
permissions: {}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev             libpipewire-0.3-dev libdbus-1-dev libgbm-dev libxcb1-dev libclang-dev             patchelf libfuse2 xdg-utils file
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: |
          pnpm -C app install --frozen-lockfile
          pnpm -C app/ui install --frozen-lockfile
      - name: Build
        env:
          CLAUDE_SYNC_RELAY_URL: https://relay.example.com
          CLAUDE_SYNC_GITHUB_CLIENT_ID: dummy
        run: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY="$(pnpm -C app tauri signer generate --ci -p '' -w /tmp/k.key >/dev/null; cat /tmp/k.key)"
          pnpm -C app tauri build --bundles deb,appimage --ci
