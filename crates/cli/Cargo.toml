[package]
name = "claude-sync-cli"
description = "claude-sync for machines without a desktop: sign in, join, sync and run as a service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "claude-sync-cli"
path = "src/main.rs"

[dependencies]
# No keychain backend: the CLI keeps its token in ~/.claude-sync/token (issue #158).
claude-sync-core = { path = "../../crates/core", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
reqwest.workspace = true
tracing.workspace = true
sha2 = "0.10"
gethostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
