[package]
name = "claude-sync-cli"
description = "claude-sync command line: the same command tree as the app, for machines without a desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "claude_sync_cli"

[[bin]]
name = "claude-sync-cli"
path = "src/main.rs"

[dependencies]
claude-sync-actions = { path = "../actions" }
claude-sync-engine = { path = "../engine" }
claude-sync-fs = { path = "../fs" }
claude-sync-github = { path = "../github", default-features = false }
claude-sync-store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["signal", "rt", "time"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.10", features = ["derive"] }
sysinfo = "0.40.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true }
