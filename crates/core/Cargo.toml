[package]
name = "claude-sync-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "claude_sync_core"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
rustls.workspace = true
tracing.workspace = true
async-trait.workspace = true
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
regex = "1"
ignore = "0.4"
sha2 = "0.10"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = { version = "0.7", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.3"

# keyring has no Linux backend unless one is enabled; without it a sign-in lives in a mock store.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
