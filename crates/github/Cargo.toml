[package]
name = "claude-sync-github"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "claude_sync_github"

[dependencies]
claude-sync-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The OS keychain; the headless CLI builds with `--no-default-features` and uses the token file.
keyring = { version = "3", features = ["windows-native", "apple-native"], optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

[features]
default = ["keychain"]
keychain = ["dep:keyring"]

[dev-dependencies]
wiremock = "0.6"
tokio.workspace = true
tempfile = "3"
